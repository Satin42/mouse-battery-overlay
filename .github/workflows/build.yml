name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt pyinstaller
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: PyInstaller
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name MouseBatteryOverlay --icon assets/icon.ico app.py
      - name: Inno Setup
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" installer.iss
      - name: Smoke test (exe starts and stays up)
        shell: pwsh
        run: |
          $p = Start-Process "dist\MouseBatteryOverlay\MouseBatteryOverlay.exe" -PassThru
          Start-Sleep 6
          if ($p.HasExited) { throw "exe exited early with code $($p.ExitCode)" }
          Stop-Process $p -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MouseBatteryOverlay-Setup
          path: dist-installer/*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist-installer/*.exe --title "$GITHUB_REF_NAME" --generate-notes
